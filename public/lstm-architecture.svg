<svg viewBox="0 0 1300 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1300" height="460" fill="#0b0d12"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b134"/>
    </marker>
  </defs>

  <g font-size="14.5" fill="#f2efe6" text-anchor="middle">
    <!-- A: cron trigger -->
    <rect x="20" y="185" width="150" height="90" rx="14" fill="#161a23" stroke="#f2b134" stroke-width="1.5"/>
    <text x="95" y="222">Daily Cron</text>
    <text x="95" y="242" fill="#c9c4b6" font-size="12">(Weekdays)</text>

    <!-- B1: fetch OHLC -->
    <rect x="210" y="50" width="160" height="80" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="290" y="85">Fetch OHLC</text>
    <text x="290" y="105" fill="#c9c4b6" font-size="12">via yfinance</text>

    <!-- B2: compute indicators -->
    <rect x="410" y="42" width="200" height="96" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="510" y="75">Compute Indicators</text>
    <text x="510" y="97" fill="#c9c4b6" font-size="11.5">SMA · MACD · RSI · Bollinger</text>
    <text x="510" y="113" fill="#c9c4b6" font-size="11.5">Stochastic · ATR · OBV</text>

    <!-- C1: fetch news -->
    <rect x="210" y="330" width="160" height="80" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="290" y="365">Fetch News</text>
    <text x="290" y="385" fill="#c9c4b6" font-size="12">via NewsAPI</text>

    <!-- C2: VADER sentiment -->
    <rect x="410" y="322" width="200" height="96" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="510" y="360">VADER Sentiment</text>
    <text x="510" y="382" fill="#c9c4b6" font-size="11.5">Score each headline</text>

    <!-- D: merge -->
    <rect x="655" y="170" width="200" height="120" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="755" y="205">Merge &amp; Align</text>
    <text x="755" y="227" fill="#c9c4b6" font-size="11.5">By trading day — rolls</text>
    <text x="755" y="243" fill="#c9c4b6" font-size="11.5">forward weekend/holiday</text>
    <text x="755" y="259" fill="#c9c4b6" font-size="11.5">sentiment</text>

    <!-- E: retrain (highlighted) -->
    <rect x="895" y="150" width="215" height="160" rx="16" fill="#12242078" stroke="#5eead4" stroke-width="2"/>
    <text x="1002" y="190" fill="#5eead4" font-weight="bold" font-size="16">Retrain BiLSTM</text>
    <text x="1002" y="212" fill="#5eead4" font-weight="bold" font-size="16">+ Attention</text>
    <text x="1002" y="238" fill="#c9c4b6" font-size="12">16 features</text>
    <text x="1002" y="256" fill="#c9c4b6" font-size="12">120-day sequences</text>
    <text x="1002" y="274" fill="#c9c4b6" font-size="12">Huber loss</text>

    <!-- G1: FastAPI -->
    <rect x="1150" y="95" width="130" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="1215" y="130">FastAPI</text>
    <text x="1215" y="150" fill="#c9c4b6" font-size="11">/predict</text>
    <text x="1215" y="166" fill="#c9c4b6" font-size="11">Docker on EC2</text>

    <!-- G2: Streamlit -->
    <rect x="1150" y="275" width="130" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="1215" y="315">Streamlit</text>
    <text x="1215" y="335" fill="#c9c4b6" font-size="11">UI dashboard</text>
  </g>

  <!-- arrows -->
  <g stroke="#5eead4" stroke-width="2" fill="none">
    <path d="M 170 210 C 195 130, 195 90, 206 90" marker-end="url(#arrow)"/>
    <path d="M 170 250 C 195 330, 195 370, 206 370" marker-end="url(#arrow)"/>
    <line x1="370" y1="90" x2="406" y2="90" marker-end="url(#arrow)"/>
    <line x1="370" y1="370" x2="406" y2="370" marker-end="url(#arrow)"/>
    <path d="M 610 90 C 640 90, 640 200, 651 220" marker-end="url(#arrow)"/>
    <path d="M 610 370 C 640 370, 640 260, 651 240" marker-end="url(#arrow)"/>
    <line x1="855" y1="230" x2="891" y2="230" marker-end="url(#arrow)"/>
    <path d="M 1110 200 C 1130 170, 1130 140, 1146 140" marker-end="url(#arrow)"/>
    <path d="M 1110 260 C 1130 290, 1130 320, 1146 320" marker-end="url(#arrow)"/>
  </g>

  <!-- daily repeat loop on cron box -->
  <path d="M 60 185 C 40 150, 90 130, 130 150 C 145 158, 148 175, 140 185" stroke="#f2b134" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="95" y="120" fill="#f2b134" font-size="11.5" text-anchor="middle" font-weight="bold">repeats every weekday</text>
</svg>
