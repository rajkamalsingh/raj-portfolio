<svg viewBox="0 0 1300 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1300" height="520" fill="#0b0d12"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2b134"/>
    </marker>
  </defs>

  <g font-size="14.5" fill="#f2efe6" text-anchor="middle">
    <!-- box 1: video input -->
    <rect x="20" y="215" width="150" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="95" y="252">Live Video</text>
    <text x="95" y="272" fill="#c9c4b6" font-size="12">Frame (OpenCV)</text>

    <!-- box 2: face detection -->
    <rect x="210" y="205" width="180" height="110" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="300" y="250">Haar Cascade</text>
    <text x="300" y="270">Face Detection</text>
    <text x="300" y="292" fill="#c9c4b6" font-size="12">Returns face box(es)</text>

    <!-- lane A: gender (top) -->
    <rect x="440" y="40" width="170" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="525" y="78">RGB Crop</text>
    <text x="525" y="98" fill="#c9c4b6" font-size="12">Gender offsets (30,60)</text>

    <rect x="650" y="25" width="200" height="120" rx="14" fill="#12242078" stroke="#5eead4" stroke-width="2"/>
    <text x="750" y="65" fill="#5eead4" font-weight="bold">Simple CNN</text>
    <text x="750" y="85" fill="#5eead4" font-weight="bold">(IMDB faces)</text>
    <text x="750" y="108" fill="#c9c4b6" font-size="12">Gender: man / woman</text>
    <text x="750" y="126" fill="#c9c4b6" font-size="12">96% val accuracy</text>

    <!-- lane B: emotion (bottom) -->
    <rect x="440" y="390" width="170" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="525" y="428">Grayscale Crop</text>
    <text x="525" y="448" fill="#c9c4b6" font-size="12">Emotion offsets (20,40)</text>

    <rect x="650" y="375" width="200" height="120" rx="14" fill="#12242078" stroke="#5eead4" stroke-width="2"/>
    <text x="750" y="410" fill="#5eead4" font-weight="bold">Mini-Xception</text>
    <text x="750" y="430" fill="#5eead4" font-weight="bold">(FER-2013)</text>
    <text x="750" y="453" fill="#c9c4b6" font-size="12">7 emotion classes</text>
    <text x="750" y="471" fill="#c9c4b6" font-size="12">66% val acc · human-level</text>

    <!-- convergence: temporal smoothing -->
    <rect x="905" y="205" width="190" height="110" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="1000" y="245">10-Frame Mode</text>
    <text x="1000" y="265">Smoothing</text>
    <text x="1000" y="287" fill="#c9c4b6" font-size="12">Reduces label flicker</text>

    <!-- final output -->
    <rect x="1135" y="215" width="150" height="90" rx="14" fill="#161a23" stroke="#262b36" stroke-width="1.5"/>
    <text x="1210" y="250">Live Overlay</text>
    <text x="1210" y="270" fill="#c9c4b6" font-size="11">"happy woman" +</text>
    <text x="1210" y="285" fill="#c9c4b6" font-size="11">colored box</text>
  </g>

  <!-- arrows: main spine -->
  <g stroke="#5eead4" stroke-width="2" fill="none">
    <line x1="170" y1="260" x2="206" y2="260" marker-end="url(#arrow)"/>
    <path d="M 390 235 C 415 200, 415 110, 436 90" marker-end="url(#arrow)"/>
    <path d="M 390 285 C 415 330, 415 415, 436 435" marker-end="url(#arrow)"/>
    <line x1="610" y1="85" x2="646" y2="85" marker-end="url(#arrow)"/>
    <line x1="610" y1="435" x2="646" y2="435" marker-end="url(#arrow)"/>
    <path d="M 850 90 C 890 130, 890 200, 901 235" marker-end="url(#arrow)"/>
    <path d="M 850 430 C 890 380, 890 320, 901 285" marker-end="url(#arrow)"/>
    <line x1="1095" y1="260" x2="1131" y2="260" marker-end="url(#arrow)"/>
  </g>

  <!-- Grad-CAM side annotation -->
  <path d="M 700 105 C 620 130, 570 150, 525 155" stroke="#f2b134" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <path d="M 700 410 C 620 380, 570 358, 525 352" stroke="#f2b134" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowAmber)"/>
  <text x="500" y="245" fill="#f2b134" font-size="12.5" text-anchor="middle" font-weight="bold">Grad-CAM: visualizes which</text>
  <text x="500" y="261" fill="#f2b134" font-size="12.5" text-anchor="middle" font-weight="bold">pixels drove each CNN's decision</text>
</svg>
